// Private Fox – Startskript (diese erste Zeile wird von Firefox übersprungen)
//
// Läuft bei jedem Start mit vollen Rechten:
//  1. liest die gewählte Schutzstufe (0–4)
//  2. setzt die passenden Browser-Einstellungen als Standardwerte
//  3. fügt den Schutz-Knopf in die Symbolleiste ein, mit dem man die Stufe wechselt
//
// Hinweis: Hier werden Standardwerte gesetzt (defaultPref). Wer in about:config selbst etwas
// ändert, behält seine Änderung. Telemetrie wird dagegen fest gesperrt (lockPref).

(function privateFox() {
  const C = Components.classes;
  const I = Components.interfaces;

  const NAMES = ["Aus", "Ausgewogen", "Stark", "Extrem", "Paranoid"];
  const DESCS = [
    "kein Blocken",
    "Werbung und Tracker weg, Seiten funktionieren fast immer",
    "+ Malware-Listen, DNS-over-HTTPS, WebRTC-Schutz, Tracking-Parameter weg",
    "+ Cookie-Banner, nur HTTPS, Fingerprinting-Schutz, kein Referrer an Dritte",
    "+ alle Skripte/Frames von Drittanbietern blockiert, Cookies beim Beenden weg",
  ];
  const COLORS = ["#6b7280", "#3ecf8e", "#c9d64a", "#ff9f43", "#ff5c5c"];
  const DEFAULT_LEVEL = 2;
  const LEVEL_FILE = "privatefox-level";

  // [ab Stufe, Einstellung, Wert, fest sperren?]
  // Gibt es eine Einstellung mehrfach, gilt der letzte Eintrag, dessen Stufe erreicht ist.
  const PREFS = [
    // ---- immer: Telemetrie und Datensammlung aus ----
    [0, "toolkit.telemetry.enabled", false, true],
    [0, "toolkit.telemetry.unified", false, true],
    [0, "toolkit.telemetry.archive.enabled", false, true],
    [0, "toolkit.telemetry.server", "data:,", true],
    [0, "datareporting.healthreport.uploadEnabled", false, true],
    [0, "datareporting.policy.dataSubmissionEnabled", false, true],
    [0, "app.shield.optoutstudies.enabled", false, true],
    [0, "app.normandy.enabled", false, true],
    [0, "browser.newtabpage.activity-stream.feeds.telemetry", false, true],
    [0, "browser.newtabpage.activity-stream.telemetry", false, true],
    [0, "browser.newtabpage.activity-stream.showSponsored", false],
    [0, "browser.newtabpage.activity-stream.showSponsoredTopSites", false],
    [0, "browser.discovery.enabled", false],
    [0, "extensions.getAddons.showPane", false],
    [0, "extensions.htmlaboutaddons.recommendations.enabled", false],
    [0, "browser.crashReports.unsubmittedCheck.autoSubmit2", false],
    [0, "dom.private-attribution.submission.enabled", false, true],
    [0, "privatefox.levelNames", NAMES.join(",")],

    // ---- Stufe 1: Ausgewogen ----
    [1, "browser.contentblocking.category", "strict"],
    [1, "privacy.globalprivacycontrol.enabled", true],
    [1, "beacon.enabled", false],
    [1, "browser.send_pings", false],
    [1, "network.prefetch-next", false],
    [1, "network.dns.disablePrefetch", true],
    [1, "network.predictor.enabled", false],
    [1, "network.http.speculative-parallel-limit", 0],
    [1, "browser.urlbar.speculativeConnect.enabled", false],
    [1, "browser.places.speculativeConnect.enabled", false],
    [1, "browser.urlbar.suggest.quicksuggest.sponsored", false],

    // ---- Stufe 2: Stark ----
    [2, "privacy.query_stripping.enabled", true],
    [2, "privacy.query_stripping.enabled.pbmode", true],
    [2, "network.http.referer.XOriginTrimmingPolicy", 2],
    [2, "media.peerconnection.ice.default_address_only", true],
    [2, "media.peerconnection.ice.no_host", true],
    [2, "media.peerconnection.ice.proxy_only_if_behind_proxy", true],
    [2, "network.IDN_show_punycode", true],
    [2, "pdfjs.enableScripting", false],
    [2, "security.mixed_content.block_display_content", true],
    [2, "browser.safebrowsing.downloads.remote.enabled", false],
    [2, "dom.security.https_first", true],
    [2, "browser.urlbar.suggest.quicksuggest.nonsponsored", false],

    // ---- Stufe 3: Extrem ----
    [3, "network.http.referer.XOriginPolicy", 1],
    [3, "privacy.fingerprintingProtection", true],
    [3, "security.ssl.require_safe_negotiation", true],
    [3, "security.tls.enable_0rtt_data", false],
    [3, "browser.formfill.enable", false],
    [3, "signon.autofillForms", false],
    [3, "media.autoplay.blocking_policy", 2],

    // ---- Stufe 4: Paranoid ----
    [4, "network.http.referer.XOriginPolicy", 2],
    [4, "privacy.resistFingerprinting", true],
    [4, "privacy.resistFingerprinting.letterboxing", true],
    [4, "webgl.disabled", true],
    [4, "media.peerconnection.enabled", false],
    [4, "security.OCSP.require", true],
  ];

  function levelFile() {
    const f = C["@mozilla.org/file/directory_service;1"]
      .getService(I.nsIProperties)
      .get("UAppData", I.nsIFile);
    f.append(LEVEL_FILE);
    return f;
  }

  function readLevel() {
    try {
      const f = levelFile();
      if (!f.exists()) {
        return DEFAULT_LEVEL;
      }
      const fis = C["@mozilla.org/network/file-input-stream;1"].createInstance(I.nsIFileInputStream);
      fis.init(f, -1, 0, 0);
      const sis = C["@mozilla.org/scriptableinputstream;1"].createInstance(I.nsIScriptableInputStream);
      sis.init(fis);
      const n = parseInt(sis.read(16), 10);
      sis.close();
      fis.close();
      return n >= 0 && n <= 4 ? n : DEFAULT_LEVEL;
    } catch (e) {
      return DEFAULT_LEVEL;
    }
  }

  const level = readLevel();

  // ---- Einstellungen anwenden ----
  const chosen = new Map();
  for (const [min, name, value, lock] of PREFS) {
    if (level >= min) {
      chosen.set(name, [value, !!lock]);
    }
  }
  for (const [name, [value, lock]] of chosen) {
    try {
      if (lock) {
        lockPref(name, value);
      } else {
        defaultPref(name, value);
      }
    } catch (e) {
      // unbekannte oder umbenannte Einstellung – ignorieren
    }
  }
  try {
    defaultPref("privatefox.level", level);
  } catch (e) {}

  // ---- Schutz-Knopf in der Symbolleiste ----
  function icon(lvl) {
    const svg =
      `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16">` +
      `<path d="M8 1 2 3.2v4.3c0 3.6 2.6 6.4 6 7.5 3.4-1.1 6-3.9 6-7.5V3.2Z" fill="${COLORS[lvl]}"/>` +
      `<text x="8" y="11.2" font-size="7.5" font-family="sans-serif" font-weight="700" ` +
      `text-anchor="middle" fill="#111">${lvl}</text></svg>`;
    return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  }

  function chooseLevel(win) {
    const items = NAMES.map((n, i) => `${i} – ${n}: ${DESCS[i]}`);
    const sel = { value: level };
    const ok = win.Services.prompt.select(
      win,
      "Private Fox – Schutzstufe",
      `Aktuell: ${level} – ${NAMES[level]}\nNeue Stufe wählen. Private Fox startet danach neu.`,
      items,
      sel
    );
    if (!ok || sel.value === level) {
      return;
    }
    const f = win.Services.dirsvc.get("UAppData", win.Ci.nsIFile);
    f.append(LEVEL_FILE);
    win.IOUtils.writeUTF8(f.path, String(sel.value)).then(
      () => {
        win.Services.startup.quit(win.Ci.nsIAppStartup.eAttemptQuit | win.Ci.nsIAppStartup.eRestart);
      },
      (e) => win.console.error("Private Fox: Stufe konnte nicht gespeichert werden", e)
    );
  }

  let widgetCreated = false;
  function createWidget(win) {
    if (widgetCreated) {
      return;
    }
    widgetCreated = true;
    const { CustomizableUI } = win.ChromeUtils.importESModule(
      "resource:///modules/CustomizableUI.sys.mjs"
    );
    const img = icon(level);
    CustomizableUI.createWidget({
      id: "privatefox-level-button",
      type: "button",
      defaultArea: CustomizableUI.AREA_NAVBAR,
      label: `Schutz: ${NAMES[level]}`,
      tooltiptext: `Private Fox – Schutzstufe ${level} (${NAMES[level]})\nKlicken zum Ändern`,
      onCreated(node) {
        node.setAttribute("image", img);
        node.style.listStyleImage = `url("${img}")`;
      },
      onCommand(event) {
        chooseLevel(event.target.ownerGlobal);
      },
    });
  }

  try {
    const obs = C["@mozilla.org/observer-service;1"].getService(I.nsIObserverService);
    obs.addObserver(
      {
        observe(subject) {
          try {
            createWidget(subject);
          } catch (e) {
            try {
              subject.console.error("Private Fox: Schutz-Knopf fehlgeschlagen", e);
            } catch (e2) {}
          }
        },
      },
      "browser-delayed-startup-finished"
    );
  } catch (e) {}
})();
