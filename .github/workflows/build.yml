name: Build Private Fox

# Runs on changes to the build code, on demand (Actions → "Build Private Fox" → Run workflow)
# and automatically every Monday to pick up Firefox security updates.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Firefox version (empty = latest)"
        required: false
        default: ""
      macos:
        description: "Also build macOS (GitHub's macOS runners are often unavailable)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "build.sh"
      - "mozconfig"
      - "FIREFOX_VERSION"
      - "scripts/**"
      - "overlay/**"
      - "branding/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      MOZILLABUILD: 'C:\mozilla-build\'
      PF_WORK_DIR: /c/pfwork
      CHERE_INVOKING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n="Free (GB)";e={[math]::Round($_.Free/1GB,1)}}

      - name: Enlarge the page file (the Rust/C++ build needs more than 16 GB RAM)
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 40GB
          disk-root: "D:"

      - name: Disable Windows Defender real-time scanning (much faster build)
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile MozillaBuildSetup.exe
          Start-Process .\MozillaBuildSetup.exe -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\msys2\usr\bin\bash.exe')) { throw "MozillaBuild not found" }

      - name: Determine Firefox version
        id: ver
        shell: cmd
        run: >-
          C:\mozilla-build\msys2\usr\bin\bash.exe -lc
          "export PATH=/c/mozilla-build/bin:/c/mozilla-build/python3:/c/mozilla-build/python3/Scripts:$PATH;
          if [ -n '${{ inputs.version }}' ]; then echo '${{ inputs.version }}' > FIREFOX_VERSION; else ./build.sh latest; fi;
          echo version=$(cat FIREFOX_VERSION) >> $(cygpath -u \"$GITHUB_OUTPUT\")"

      - name: Build (takes several hours)
        shell: cmd
        run: >-
          C:\mozilla-build\msys2\usr\bin\bash.exe -lc
          "export PATH=/c/mozilla-build/bin:/c/mozilla-build/python3:/c/mozilla-build/python3/Scripts:$PATH;
          ./build.sh all"

      - name: Free disk space after build
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n="Free (GB)";e={[math]::Round($_.Free/1GB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: privatefox-windows
          path: out/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (Apple Silicon)
    # Off for now: only when started by hand with "Also build macOS" ticked.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.macos }}
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" ~/Library/Android /usr/local/share/dotnet ~/.dotnet /Users/runner/hostedtoolcache/CodeQL || true
          df -h /

      - name: Determine Firefox version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "${{ inputs.version }}" > FIREFOX_VERSION; else ./build.sh latest; fi
          echo "version=$(cat FIREFOX_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build (takes several hours)
        run: ./build.sh all

      - name: Free disk space after build
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: privatefox-macos
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [windows, macos]
    if: ${{ always() && (needs.windows.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version
        id: v
        run: echo "version=${{ needs.windows.outputs.version || needs.macos.outputs.version }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}-${{ github.run_number }}
          name: Private Fox ${{ steps.v.outputs.version }}
          files: dist/*
          body: |
            Private Fox based on Firefox ${{ steps.v.outputs.version }}.

            **Windows:** `.exe` = installer, `.zip` = portable version (unzip, run `privatefox.exe`).
            SmartScreen warns because the build isn't code-signed: "More info → Run anyway".

            **macOS (Apple Silicon), when included:** open the `.dmg`, drag Private Fox into Applications, then run once in Terminal:
            `xattr -cr "/Applications/Private Fox.app"`. Otherwise macOS says the app is damaged.

            Installation guide: https://github.com/no-pixel21/PrivateFox#installation

            Windows: ${{ needs.windows.result }} · macOS: ${{ needs.macos.result }}
