name: Build Private Fox

# Runs on changes to the build code, on demand (Actions → "Build Private Fox" → Run workflow)
# and once a day: if Mozilla released a new Firefox version, build it (Firefox security fixes
# reach Private Fox users within about a day via automatic updates).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Firefox version (empty = latest)"
        required: false
        default: ""
      macos:
        description: "Also build macOS (GitHub's macOS runners are often unavailable)"
        type: boolean
        required: false
        default: false
  push:
    branches: [main]
    paths:
      - "build.sh"
      - "mozconfig"
      - "FIREFOX_VERSION"
      - "scripts/**"
      - "overlay/**"
      - "branding/**"
      - "update-signing/**"
      - ".github/workflows/build.yml"
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  pages: write

jobs:
  check:
    name: Is there something to build?
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.c.outputs.build }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          latest=$(curl -fsSL https://product-details.mozilla.org/1.0/firefox_versions.json | jq -r .LATEST_FIREFOX_VERSION)
          last=$(gh release view --repo "${{ github.repository }}" --json tagName -q .tagName 2>/dev/null | sed -E 's/^v//; s/-[0-9]+$//')
          echo "Latest Firefox: $latest – last Private Fox release: ${last:-none}"
          if [ -n "$latest" ] && [ "$latest" != "$last" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  windows:
    name: Windows (x64)
    needs: check
    if: ${{ needs.check.outputs.build == 'true' }}
    runs-on: windows-2022
    timeout-minutes: 360
    outputs:
      version: ${{ steps.ver.outputs.version }}
    env:
      MOZILLABUILD: 'C:\mozilla-build\'
      PF_WORK_DIR: /c/pfwork
      CHERE_INVOKING: "1"
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n="Free (GB)";e={[math]::Round($_.Free/1GB,1)}}

      - name: Enlarge the page file (the Rust/C++ build needs more than 16 GB RAM)
        uses: al-cheb/configure-pagefile-action@v1.4
        with:
          minimum-size: 16GB
          maximum-size: 40GB
          disk-root: "D:"

      - name: Disable Windows Defender real-time scanning (much faster build)
        shell: pwsh
        run: Set-MpPreference -DisableRealtimeMonitoring $true

      - name: Install MozillaBuild
        shell: pwsh
        run: |
          Invoke-WebRequest https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe -OutFile MozillaBuildSetup.exe
          Start-Process .\MozillaBuildSetup.exe -ArgumentList '/S' -Wait
          if (-not (Test-Path 'C:\mozilla-build\msys2\usr\bin\bash.exe')) { throw "MozillaBuild not found" }

      - name: Determine Firefox version
        id: ver
        shell: cmd
        run: >-
          C:\mozilla-build\msys2\usr\bin\bash.exe -lc
          "export PATH=/c/mozilla-build/bin:/c/mozilla-build/python3:/c/mozilla-build/python3/Scripts:$PATH;
          if [ -n '${{ inputs.version }}' ]; then echo '${{ inputs.version }}' > FIREFOX_VERSION; else ./build.sh latest; fi;
          echo version=$(cat FIREFOX_VERSION) >> $(cygpath -u \"$GITHUB_OUTPUT\")"

      - name: Build (takes several hours)
        shell: cmd
        run: >-
          C:\mozilla-build\msys2\usr\bin\bash.exe -lc
          "export PATH=/c/mozilla-build/bin:/c/mozilla-build/python3:/c/mozilla-build/python3/Scripts:$PATH;
          ./build.sh all"

      - name: Create signed update file
        # A signing problem must not block the release; it just means no automatic update this time.
        continue-on-error: true
        shell: cmd
        env:
          PF_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: >-
          C:\mozilla-build\msys2\usr\bin\bash.exe -lc
          "export PATH=/c/mozilla-build/bin:/c/mozilla-build/python3:/c/mozilla-build/python3/Scripts:$PATH;
          ./build.sh update-mar"

      - name: Free disk space after build
        if: always()
        shell: pwsh
        run: Get-PSDrive -PSProvider FileSystem | Format-Table Name, @{n="Free (GB)";e={[math]::Round($_.Free/1GB,1)}}

      - uses: actions/upload-artifact@v4
        with:
          name: privatefox-windows
          path: out/*
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS (Apple Silicon)
    # Off for now: only when started by hand with "Also build macOS" ticked.
    needs: check
    if: ${{ needs.check.outputs.build == 'true' && github.event_name == 'workflow_dispatch' && inputs.macos }}
    runs-on: macos-15
    timeout-minutes: 360
    outputs:
      version: ${{ steps.ver.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Free up disk space
        run: |
          df -h /
          sudo rm -rf "${ANDROID_HOME:-/nonexistent}" ~/Library/Android /usr/local/share/dotnet ~/.dotnet /Users/runner/hostedtoolcache/CodeQL || true
          df -h /

      - name: Determine Firefox version
        id: ver
        run: |
          if [ -n "${{ inputs.version }}" ]; then echo "${{ inputs.version }}" > FIREFOX_VERSION; else ./build.sh latest; fi
          echo "version=$(cat FIREFOX_VERSION)" >> "$GITHUB_OUTPUT"

      - name: Build (takes several hours)
        run: ./build.sh all

      - name: Create signed update file
        # A signing problem must not block the release; it just means no automatic update this time.
        continue-on-error: true
        env:
          PF_UPDATE_KEY: ${{ secrets.UPDATE_SIGNING_KEY }}
        run: |
          command -v xz >/dev/null || brew install xz
          ./build.sh update-mar

      - name: Free disk space after build
        if: always()
        run: df -h /

      - uses: actions/upload-artifact@v4
        with:
          name: privatefox-macos
          path: out/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: [windows, macos]
    if: ${{ always() && (needs.windows.result == 'success' || needs.macos.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Version and tag
        id: v
        run: |
          echo "version=${{ needs.windows.outputs.version || needs.macos.outputs.version }}" >> "$GITHUB_OUTPUT"
          echo "tag=v${{ needs.windows.outputs.version || needs.macos.outputs.version }}-${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.v.outputs.tag }}
          name: Private Fox ${{ steps.v.outputs.version }}
          files: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.mar
          body: |
            Private Fox based on Firefox ${{ steps.v.outputs.version }}.

            **Windows:** `.exe` = installer, `.zip` = portable version (unzip, run `privatefox.exe`).
            SmartScreen warns because the build isn't code-signed: "More info → Run anyway".

            **macOS (Apple Silicon), when included:** open the `.dmg`, drag Private Fox into Applications, then run once in Terminal:
            `xattr -cr "/Applications/Private Fox.app"`. Otherwise macOS says the app is damaged.

            Already have Private Fox with automatic updates? It updates itself – no need to download.
            The `.mar` files are those automatic updates.

            Installation guide: https://github.com/no-pixel21/PrivateFox#installation

            Windows: ${{ needs.windows.result }} · macOS: ${{ needs.macos.result }}

      - name: Publish update feed
        run: |
          shopt -s nullglob
          infos=(dist/meta/update-info-*.json)
          if [ ${#infos[@]} -eq 0 ]; then
            echo "No signed update files in this build – update feed unchanged."
            exit 0
          fi
          base="https://github.com/${{ github.repository }}/releases/download/${{ steps.v.outputs.tag }}"
          details="https://github.com/${{ github.repository }}/releases/tag/${{ steps.v.outputs.tag }}"
          for f in "${infos[@]}"; do
            plat=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["platform"])' "$f")
            mar=$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["mar"])' "$f")
            python3 scripts/update_info.py xml --info "$f" --mar-url "$base/$mar" \
              --details-url "$details" --out "docs/update/$plat/update.xml"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/update
          if git diff --cached --quiet; then
            echo "Update feed already up to date."
            exit 0
          fi
          git commit -m "Update feed: Private Fox ${{ steps.v.outputs.version }} (${{ steps.v.outputs.tag }}) [skip ci]"
          git push origin HEAD:main
          # Pushes made with GITHUB_TOKEN don't start a Pages build on their own.
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages build request failed – it will update with the next push."
        env:
          GH_TOKEN: ${{ github.token }}
